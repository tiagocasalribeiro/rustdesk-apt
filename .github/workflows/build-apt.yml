name: Build and publish apt repository (RustDesk)

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio actual
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg curl jq

      - name: Descarregar .deb e preparar changelog limpo
        run: |
          # 1. Obter dados do ultimo release oficial do RustDesk
          RELEASE_DATA=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest)
          
          # 2. Extrair URL do .deb (amd64/x86_64)
          DEB_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | test("rustdesk-.*x86_64\\.deb$|rustdesk-.*amd64\\.deb$")) | .browser_download_url' | head -n 1)
          
          if [ -z "$DEB_URL" ]; then
            echo "::error::Nenhum ficheiro .deb encontrado no ultimo release do RustDesk."
            exit 1
          fi

          # 3. Extrair tag da versao e corpo do release
          TAG_NAME=$(echo "$RELEASE_DATA" | jq -r '.tag_name')
          FULL_BODY=$(echo "$RELEASE_DATA" | jq -r '.body // ""')
          
          echo "$FULL_BODY" > FULL_BODY.md
          
          # 4. Filtrar APENAS o changelog (remove a tabela de downloads e texto promocional)
          LINE_NUM=$(grep -i -n "changelog" FULL_BODY.md | head -n 1 | cut -d: -f1)
          if [ -n "$LINE_NUM" ]; then
            tail -n +"$LINE_NUM" FULL_BODY.md > CHANGELOG_ONLY.md
          else
            cp FULL_BODY.md CHANGELOG_ONLY.md
          fi
          
          # 5. Criar o ficheiro final com a imagem de aviso no topo
          # NOTA: Substitua este URL pelo link 'Raw' permanente da imagem no seu proprio repositorio (ver instrucoes abaixo)
          SCAM_IMAGE_URL="https://raw.githubusercontent.com/tiagocasalribeiro/rustdesk-apt/main/assets/scam_warning.png"
          
          echo "![Aviso de Seguranca / Scam Warning]($SCAM_IMAGE_URL)" > RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          
          # Anexar o changelog limpo ao aviso
          cat CHANGELOG_ONLY.md >> RELEASE_BODY.md
          
          # 6. Descarregar e normalizar o nome do ficheiro
          echo "A descarregar: $DEB_URL"
          curl -L -o rustdesk_temp.deb "$DEB_URL"
          
          ORIGINAL_NAME=$(basename "$DEB_URL")
          VERSION=$(echo "$ORIGINAL_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?' | head -n 1)
          NEW_NAME="rustdesk_${VERSION}_amd64.deb"
          
          echo "A renomear $ORIGINAL_NAME para $NEW_NAME"
          mv rustdesk_temp.deb "$NEW_NAME"
          
          # Exportar variaveis para os passos seguintes
          echo "DEB_FILE=$NEW_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          
          ls -la *.deb

      - name: Criar estrutura do site APT
        run: |
          mkdir -p site/pool/main/r/rustdesk
          mkdir -p site/dists/stable/main/binary-amd64
          cp ./*.deb site/pool/main/r/rustdesk/

      - name: Importar chave GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID="$(gpg --list-keys --with-colons | awk -F: '/^pub:/ {print $5; exit}')"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          gpg --export --armor "$GPG_KEY_ID" > site/KEY.gpg

      - name: Gerar metadados APT
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd site
          dpkg-scanpackages pool/main /dev/null 2>/dev/null \
            > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz

          cat > /tmp/ftp-release.conf << EOF
          APT::FTPArchive::Release::Origin "RustDesk Unofficial Repo";
          APT::FTPArchive::Release::Label "RustDesk";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "Repositorio nao oficial de pacotes Debian para RustDesk";
          EOF

          cd dists/stable
          apt-ftparchive release -c=/tmp/ftp-release.conf . > Release

          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release

          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --default-key "$GPG_KEY_ID" --detach-sign --armor -o Release.gpg Release

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Criar Release no GitHub com o .deb e changelog limpo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RustDesk ${{ env.RELEASE_TAG }}
          body_path: RELEASE_BODY.md
          files: ${{ env.DEB_FILE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
